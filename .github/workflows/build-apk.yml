name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build_android_apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.3'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate app icon
        run: flutter pub run flutter_launcher_icons

      - name: Prepare signing key
        shell: bash
        env:
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # A release artifact must never silently fall back to the debug key.
          if [ -z "$KEY_PROPERTIES" ] || [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing KEY_PROPERTIES or KEYSTORE_BASE64 GitHub secret."
            exit 1
          fi

          printf '%s' "$KEY_PROPERTIES" > android/key.properties
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          # app/build.gradle resolves storeFile relative to android/app.
          # Therefore KEY_PROPERTIES must contain: storeFile=upload-keystore.jks
          if ! grep -qx 'storeFile=upload-keystore.jks' android/key.properties; then
            echo "KEY_PROPERTIES must contain exactly: storeFile=upload-keystore.jks"
            exit 1
          fi

      - name: Build APK release
        run: flutter build apk --release

      - name: Verify APK integrity and signature
        shell: bash
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
