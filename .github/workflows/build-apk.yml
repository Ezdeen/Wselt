name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build_android_apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.3'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate app icon
        run: flutter pub run flutter_launcher_icons

      - name: Prepare signing key
        shell: bash
        env:
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_PROPERTIES" ] && [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEY_PROPERTIES" > android/key.properties
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

            # app/build.gradle resolves storeFile relative to android/app.
            if ! grep -qx 'storeFile=upload-keystore.jks' android/key.properties; then
              echo "KEY_PROPERTIES must contain exactly: storeFile=upload-keystore.jks"
              exit 1
            fi

            echo "BUILD_MODE=release" >> "$GITHUB_ENV"
          elif [ -z "$KEY_PROPERTIES" ] && [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets found; building an installable debug APK for testing."
            echo "BUILD_MODE=debug" >> "$GITHUB_ENV"
          else
            echo "Provide both KEY_PROPERTIES and KEYSTORE_BASE64, or neither for a debug build."
            exit 1
          fi

      - name: Build APK
        run: flutter build apk --${BUILD_MODE}

      - name: Verify APK integrity and signature
        shell: bash
        run: |
          APK=build/app/outputs/flutter-apk/app-${BUILD_MODE}.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-${{ env.BUILD_MODE }}-apk
          path: build/app/outputs/flutter-apk/app-${{ env.BUILD_MODE }}.apk
