name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build_android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.3'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate app icon
        run: flutter pub run flutter_launcher_icons

      - name: Prepare signing key
        shell: bash
        env:
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_PROPERTIES" ] && [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEY_PROPERTIES" > android/key.properties
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "BUILD_MODE=release" >> "$GITHUB_ENV"
          else
            echo "No signing secrets found; the workflow will build an unsigned release APK for testing."
            echo "BUILD_MODE=release" >> "$GITHUB_ENV"
          fi

      - name: Clean previous build
        run: flutter clean

      - name: Build optimized APK for testing
        run: flutter build apk --release --split-per-abi

      - name: Verify APK files
        shell: bash
        run: |
          ls -R build/app/outputs
          find build/app/outputs -type f -name '*.apk' | sort

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v5
        with:
          name: android-test-apks
          path: build/app/outputs/flutter-apk/*.apk
